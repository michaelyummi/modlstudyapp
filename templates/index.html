<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta charset="UTF-8">
    <title>Modl Study App</title>
</head>
<body>
    <h1>Modl Study App</h1>
    <h2>Add Classes</h2>
    <form action="/add-item" method="POST">
        <input type="text" name="class_name" placeholder="Enter Classes..."></input>
        <button type="submit">Add to Classes</button>
    </form>

    <hr>
    <h2>Classes</h2>
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">

    {% for id, name in items %}
        <a href="/click-item/{{ id }}">
            <button style="padding: 10px; cursor: pointer;">
                {{ name }}
            </button>
        </a>
    {% else %}
        <p>No Classes added, add classes above.</p>
    {% endfor %}

    </div>

    
</body>
</html>
